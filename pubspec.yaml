name: qingqinglife
description: 青轻生活馆 - 会员制电商 Flutter App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.5.0

  # Network
  dio: ^5.11.0

  # Model / JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Image
  cached_network_image: ^3.4.1

  # Utility
  intl: ^0.20.3
  uuid: ^4.6.0
  logger: ^2.7.0

  # Device
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3

  # Social login
  fluwx: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/common/
    - assets/images/home/
    - assets/images/product/
    - assets/images/member/
    - assets/images/service/
    - assets/images/points/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
