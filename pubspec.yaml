name: qingqinglife
description: 青轻生活馆 - 会员制电商 Flutter App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Routing
  go_router: ^18.0.0

  # Network
  dio: ^5.11.0
  crypto: ^3.0.7
  encrypt: ^5.0.3

  #高德
  amap_flutter_location: ^3.0.0
  amap_flutter_map: ^3.0.0

  #定位
  geolocator: ^14.0.3
  permission_handler: ^13.0.1

  # Model / JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Image
  cached_network_image: ^3.4.1

  # Utility
  intl: ^0.20.3
  uuid: ^4.6.0
  # Device
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3

  path_provider: ^2.1.0
  flutter_launcher_icons: ^0.14.4
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.1

  platform_adaptive_widgets:
    hosted:
      name: platform_adaptive_widgets
      url: https://pub.dev
    version: ^2.1.2

  # Social login
  fluwx: ^6.0.2
  talker_flutter: ^5.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/common/
    - assets/images/home/
    - assets/images/product/
    - assets/images/member/
    - assets/images/service/
    - assets/images/points/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
