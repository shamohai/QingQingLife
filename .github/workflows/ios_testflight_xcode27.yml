name: iOS TestFlight - Xcode 27 (experimental)

# [实验] Xcode 27 工作流，仅用于验证兼容性
# Archive 不签名（避免 SPM 插件与 Pods 的签名冲突），归档后使用 Apple Distribution 证书 + App Store 描述文件
# 自行签名 App 及内嵌 framework，打包 IPA 并通过 App Store Connect API 密钥上传 TestFlight
on:
  workflow_dispatch:

# 构建号手动指定：每次上传前递增，必须大于 App Store Connect 中该版本已有的最大构建号
env:
  BUILD_NUMBER: "1"

jobs:
  testflight:
    name: Build & Upload to TestFlight (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        # umeng_common_sdk 仅提供 podspec，需要通过 CocoaPods 集成（依赖 UMCommon / UMDevice）
        run: |
          cd ios
          pod install --repo-update

      - name: Select Xcode 27.2
        # xcode-27 镜像预装 Xcode 27.0/27.1/27.2（iOS 27 SDK），显式指定 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Write App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Import distribution certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          P12="$RUNNER_TEMP/distribution.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$P12_BASE64" | base64 --decode > "$P12"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)

          # 解析描述文件，安装到 Xcode 能识别的目录
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          echo "Provisioning profile: $NAME ($UUID)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive iOS app (unsigned)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            FLUTTER_BUILD_NAME=1.0.1 \
            FLUTTER_BUILD_NUMBER=${{ env.BUILD_NUMBER }} \
            archive

      - name: Sign app and package IPA
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          WORK="$RUNNER_TEMP/ipa_work"
          APP_DIR="$WORK/Payload/Runner.app"

          rm -rf "$WORK" && mkdir -p "$WORK/Payload"
          cp -R "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app" "$WORK/Payload/"

          cp "$PROFILE" "$APP_DIR/embedded.mobileprovision"
          # 只保留 App 必需的 entitlements，不使用描述文件里的全部内容（其中的 iCloud 通配符会被 App Store 拒绝）
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            "<key>application-identifier</key><string>${APP_ID}</string>" \
            "<key>com.apple.developer.team-identifier</key><string>${TEAM}</string>" \
            '<key>get-task-allow</key><false/>' \
            '</dict></plist>' > "$RUNNER_TEMP/entitlements.plist"
          plutil -lint "$RUNNER_TEMP/entitlements.plist"
          echo "Entitlements: $APP_ID"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Apple Distribution" | head -n 1 | awk '{print $2}')
          echo "Signing identity: $IDENTITY"

          # 内嵌第三方 framework 的 MinimumOSVersion 必须不低于 App 的部署目标（ITMS-90208）
          # WechatOpenSDK 自身声明为 12.0，与 App 的 15.0 不一致，这里统一为 15.0
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_DIR/Info.plist")
          find "$APP_DIR/Frameworks" -name "*.framework" -maxdepth 1 -print0 | while IFS= read -r -d '' fw; do
            if [ -f "$fw/Info.plist" ]; then
              CUR=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$fw/Info.plist" 2>/dev/null || echo "")
              if [ -n "$CUR" ]; then
                /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $MIN_OS" "$fw/Info.plist"
                echo "Set MinimumOSVersion for $(basename "$fw"): $CUR -> $MIN_OS"
              fi
            fi
          done

          # 先签名内嵌的 framework / dylib（包括 WechatOpenSDK），再签名 App 本身
          find "$APP_DIR" \( -name "*.framework" -o -name "*.dylib" \) -print0 | while IFS= read -r -d '' item; do
            xattr -cr "$item"
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp "$item"
          done

          xattr -cr "$APP_DIR"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp "$APP_DIR"

          echo "== verify app"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          echo "== verify WechatOpenSDK"
          codesign --verify --strict --verbose=2 "$APP_DIR/Frameworks/WechatOpenSDK.framework"

          IPA_DIR="$GITHUB_WORKSPACE/build/ios/ipa"
          mkdir -p "$IPA_DIR"
          (cd "$WORK" && zip -qry "$IPA_DIR/QingQingLife.ipa" Payload)
          ls -la "$IPA_DIR"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_FILE="$GITHUB_WORKSPACE/build/ios/ipa/QingQingLife.ipa"
          echo "Uploading $IPA_FILE"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@v6
        with:
          name: qingqinglife-testflight-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
