name: iOS Cloud Build (GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '打包类型 (adhoc / app-store / development)'
        required: true
        default: 'adhoc'
        type: choice
        options:
          - adhoc
          - app-store
          - development
  push:
    branches:
      - main
      - release/*

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Import Signing Certificate & Provisioning Profile (Optional)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Signing Certificate and Provisioning Profile..."
            
            # 创建临时 keychain
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            # 解码 P12 和 Provisioning Profile
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            # 创建并解锁 KeyChain
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # 导入 P12 证书
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | xargs)

            # 安装 Provisioning Profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            
            echo "Certificate & Provisioning Profile installed successfully."
          else
            echo "No signing secrets provided, building without custom keychain setup..."
          fi

      - name: Build Flutter iOS IPA
        run: |
          # 如果提供了证书和 ExportOptions，可以使用带签名的打包；无证书时可生成 release 产物/无签名 ipa
          if [ -f "ios/ExportOptions.plist" ] && [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          else
            flutter build ipa --release --no-codesign
          fi

      - name: Upload Build Artifacts (IPA / Runner.app)
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.sha }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive
          retention-days: 7
